name: Unit Tests

on:
  push:
    branches:
      - master

jobs:
  test:
    runs-on: windows-2025-vs2026

    defaults:
      run:
        shell: cmd

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up MSBuild path
        uses: microsoft/setup-msbuild@v3

      - name: Build solution
        run: msbuild galaxy.sln /p:Configuration=Debug /p:Platform=x64

      - name: Run tests
        run: tests\bin\Debug\tests.exe
